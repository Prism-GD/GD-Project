name: Prisma Geode Android build
on:
  push:
    branches: [ main, "prisma/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-geode-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prisma with official Geode Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.22.1"
          # Android publishes API 37 as android-37.0, while this AGP build resolves android-37.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"

      - name: Adapt upstream launcher for Prisma and Geode 6 alpha
        working-directory: third_party/geode-android
        run: |
          set -euo pipefail
          sed -i 's/val currentGeodeVersion = "5.11.2"/val currentGeodeVersion = "6.0.0-alpha.1"/' app/build.gradle.kts
          sed -i 's/applicationId = "com.geode.launcher"/applicationId = "com.prismgd.launcher"/' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'buildConfigField("String", "PREBUNDLED_GEODE", "null")',
              'buildConfigField("String", "PREBUNDLED_GEODE", "\\"$currentGeodeVersion\\"")',
          )
          p.write_text(s)
          PY
          sed -i 's/withFlavor("distribution" to "googlePlay")/withFlavor("distribution" to "standard")/' app/build.gradle.kts
          sed -i 's/versionName = "1.9.0"/versionName = "0.2.0-geode6-alpha.1"/' app/build.gradle.kts
          sed -i 's#<string name="app_name" translatable="false">Geode</string>#<string name="app_name" translatable="false">Prisma Launcher</string>#' app/src/main/res/values/strings.xml
          grep -q 'currentGeodeVersion = "6.0.0-alpha.1"' app/build.gradle.kts
          grep -q 'applicationId = "com.prismgd.launcher"' app/build.gradle.kts
          grep -q 'Prisma Launcher' app/src/main/res/values/strings.xml

      - name: Configure native build and use the NDK-supported LLD linker
        working-directory: third_party/geode-android
        run: |
          set -euo pipefail
          gradle --no-daemon ':app:configureCMakeDebug[arm64-v8a]' ':app:configureCMakeDebug[armeabi-v7a]'
          # NDK 30 no longer ships GNU gold; replace the stale gold selector in generated Ninja files.
          find app/.cxx -name build.ninja -print -exec sed -i 's/-fuse-ld=gold/-fuse-ld=lld/g' {} +
          if find app/.cxx -name build.ninja -exec grep -H -- '-fuse-ld=gold' {} +; then
            echo "Unsupported gold linker flag remains in Ninja build commands"
            exit 1
          fi
          echo "Ninja build commands now use the NDK-supported LLD linker."

      - name: Build Prisma with native Geode loader (arm64 and armeabi-v7a)
        working-directory: third_party/geode-android
        run: gradle --no-daemon :app:assembleStandardDebug

      - name: Verify APK contains native Geode and launcher libraries
        working-directory: third_party/geode-android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/standard/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libgeode.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/liblauncherfix.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libgeode.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/liblauncherfix.so'

      - name: Upload integrated launcher build for validation
        uses: actions/upload-artifact@v4
        with:
          name: prisma-geode6-native-validation
          path: third_party/geode-android/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
