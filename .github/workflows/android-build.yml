name: Prisma Geode Android build
on:
  push:
    branches: [ main, "prisma/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-geode-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prisma with official Geode Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "ndk;30.0.16248370" "cmake;3.21.0"

      - name: Adapt upstream launcher for Prisma and Geode 6 alpha
        working-directory: third_party/geode-android
        run: |
          set -euo pipefail
          sed -i 's/val currentGeodeVersion = "5.11.2"/val currentGeodeVersion = "6.0.0-alpha.1"/' app/build.gradle.kts
          sed -i 's/applicationId = "com.geode.launcher.play"/applicationId = "com.prismgd.launcher"/' app/build.gradle.kts
          sed -i 's/versionName = "1.9.0"/versionName = "0.2.0-geode6-alpha.1"/' app/build.gradle.kts
          sed -i 's#<string name="app_name" translatable="false">Geode</string>#<string name="app_name" translatable="false">Prisma Launcher</string>#' app/src/main/res/values/strings.xml
          grep -q 'currentGeodeVersion = "6.0.0-alpha.1"' app/build.gradle.kts
          grep -q 'applicationId = "com.prismgd.launcher"' app/build.gradle.kts
          grep -q 'Prisma Launcher' app/src/main/res/values/strings.xml

      - name: Build Prisma with native Geode loader (arm64 and armeabi-v7a)
        working-directory: third_party/geode-android
        run: gradle --no-daemon :app:assembleGooglePlayDebug

      - name: Upload integrated launcher build for validation
        uses: actions/upload-artifact@v4
        with:
          name: prisma-geode6-native-validation
          path: third_party/geode-android/app/build/outputs/apk/googlePlay/debug/*.apk
          if-no-files-found: error
